name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install test Python
        run: uv python install ${{ matrix.python-version }}

      - name: Python compatibility tests
        run: uv run --python ${{ matrix.python-version }} --with pytest python -m pytest skills/progress-tracker/scripts/ -q

      - name: Install ruff
        run: uv tool install ruff==0.16.0

      - name: ruff check
        run: uv tool run ruff check .

      - name: Consistency gate (verify.sh)
        run: bash scripts/verify.sh
